# Builds the prerendered landing and publishes it to GitHub Pages.
# In the repo: Settings → Pages → Source: "GitHub Actions".
name: Publicar landing

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      # base_path is "/<repo>" on a project site (e.g. /Klavyra) and empty on a user site or custom domain.
      - run: npx ng build --base-href "${{ steps.pages.outputs.base_path }}/"

      # Angular writes the static site to dist/<project>/browser. .nojekyll keeps files that start with "_".
      - run: touch dist/klavyra-landing/browser/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/klavyra-landing/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
